name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      # APK debug-signe : installable directement (sideload), aucun keystore a gerer.
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
      # Publie aussi l'APK comme artefact OCI dans GitHub Packages (ghcr), paquet "resilience".
      - uses: oras-project/setup-oras@v1
      - name: Publier l'APK sur GitHub Packages (ghcr)
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          REPO="ghcr.io/${OWNER,,}/resilience"
          oras push "$REPO:$TAG" \
            --artifact-type application/vnd.android.package-archive \
            android/app/build/outputs/apk/debug/app-debug.apk:application/vnd.android.package-archive
          oras tag "$REPO:$TAG" latest
