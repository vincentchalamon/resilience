name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      # APK signe avec une cle de release stable (secrets) : mises a jour in-place sans perte de donnees.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RESILIENCE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - run: ./gradlew assembleRelease
        working-directory: android
        env:
          RESILIENCE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RESILIENCE_KEYSTORE_PASSWORD: ${{ secrets.RESILIENCE_KEYSTORE_PASSWORD }}
          RESILIENCE_KEY_ALIAS: ${{ secrets.RESILIENCE_KEY_ALIAS }}
          RESILIENCE_KEY_PASSWORD: ${{ secrets.RESILIENCE_KEY_PASSWORD }}
          RESILIENCE_VERSION_CODE: ${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: android/app/build/outputs/apk/release/resilience.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: resilience-apk
          path: android/app/build/outputs/apk/release/resilience.apk
